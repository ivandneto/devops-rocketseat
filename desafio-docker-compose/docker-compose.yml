services:

  banco:                       # ← o --name vira o nome do serviço (e o hostname!)
    image: postgres:18-alpine                 # a imagem do final do docker run
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      FADA_APP_USER: ${FADA_APP_USER}      # extras: o script de inicialização lê estas
      FADA_APP_PASSWORD: ${FADA_APP_PASSWORD}
    volumes:                                        # ◄── 1. USAR (dentro do banco)
          - fada-dados:/var/lib/postgresql              #     dados do banco
          - ./db/init:/docker-entrypoint-initdb.d:ro    #     seu script (bind mount)
    networks:
      - fada-network  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .                 # onde está o Dockerfile? (dica: a pasta atual)
    ports:
      - "8002:8000"
    environment:
      DB_USER: ${FADA_APP_USER}
      DB_PASSWORD: ${FADA_APP_PASSWORD}
      DB_HOST: banco             # qual o nome do serviço do banco?
      DB_NAME: ${DB_NAME}
    depends_on:
      banco:
        condition: service_healthy
    networks:
      - fada-network

volumes:
  fada-dados:
    name: fada-dados                        # declara o volume (só o nome, e os dois pontos)

networks:
  fada-network:
    name: fada-network                         # declara a rede (só o nome, e os dois pontos)